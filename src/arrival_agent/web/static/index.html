<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uber-arrival-agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAFA; --surface:#FFF; --ink:#0A0A0A; --ink-dim:#666; --ink-faint:#999;
  --rule:#E5E5E5; --accent-ink:#0A0A0A; --accent-paper:#FFF; --focus:#0066FF;
  --s1:4px; --s2:8px; --s3:16px; --s4:24px; --s5:32px; --s6:48px; --s8:64px;
  --r-sm:4px; --r-md:8px;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --sans:'Inter',-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0A0A0A; --surface:#141414; --ink:#F5F5F5; --ink-dim:#9A9A9A;
        --ink-faint:#6A6A6A; --rule:#262626; --accent-ink:#F5F5F5; --accent-paper:#0A0A0A;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;}
.wrap{max-width:720px; margin:0 auto; padding:var(--s6) var(--s4);}
a{color:inherit}
button{font-family:inherit; cursor:pointer}
.hidden{display:none !important}

/* wordmark + header */
.wordmark{font-size:15px; letter-spacing:.04em; color:var(--ink); font-weight:500;}
.tagline{color:var(--ink-dim); max-width:34rem; margin-top:var(--s3);}
header.bar{display:flex; justify-content:space-between; align-items:center;
  border-bottom:1px solid var(--rule); padding-bottom:var(--s3); margin-bottom:var(--s5);}
.back{background:none; border:none; color:var(--ink-dim); font-size:14px; padding:6px 8px; margin-left:-8px;}
.back:hover{color:var(--ink)}

/* landing scenario cards */
.scenarios{margin-top:var(--s6); display:grid; gap:var(--s3);}
.scn{display:block; width:100%; text-align:left; background:var(--surface);
  border:1px solid var(--rule); border-radius:var(--r-md); padding:var(--s4);
  color:inherit; transition:background .12s,color .12s,border-color .12s;}
.scn:hover,.scn:focus-visible{background:var(--accent-ink); color:var(--accent-paper); border-color:var(--accent-ink);}
.scn h3{margin:0 0 6px; font-size:18px; font-weight:600;}
.scn h3::before{content:"▶ "; color:inherit;}
.scn p{margin:0; font-size:14px; color:var(--ink-dim);}
.scn:hover p,.scn:focus-visible p{color:var(--accent-paper); opacity:.85;}
.source{display:inline-block; margin-top:var(--s6); font-size:14px; color:var(--ink-faint); text-decoration:none;}
.source:hover{color:var(--ink-dim)}

/* streaming view */
.current{font-size:24px; line-height:1.3; font-weight:500; min-height:1.3em;}
.current .verb{color:var(--ink)}
.reasoning{font-family:var(--mono); font-size:14px; line-height:1.6; color:var(--ink);
  margin-top:var(--s4); display:flex; flex-direction:column; gap:var(--s2);}
.rline{color:var(--ink-dim)}
.rline .tag{color:var(--ink-faint)}
.rline.latest{color:var(--ink)}
.divider{border:0; border-top:1px solid var(--rule); margin:var(--s5) 0;}
.timeline{font-family:var(--mono); font-size:12px; color:var(--ink-faint); display:flex; flex-direction:column; gap:3px;}
.timeline .now{color:var(--ink)}

/* choice cards */
.choice-intro{font-size:14px; color:var(--ink-dim); margin:var(--s5) 0 var(--s3);}
.cards{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s3);}
.card{background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-md);
  padding:var(--s4); text-align:left; color:inherit; min-height:44px;
  animation:fade .24s ease both; transition:background .12s,color .12s,border-color .12s;}
.card:hover,.card:focus-visible{background:var(--accent-ink); color:var(--accent-paper); border-color:var(--accent-ink);}
.card .name{font-size:18px; font-weight:600;}
.card .cuis{font-size:12px; color:var(--ink-faint); margin-top:2px;}
.card:hover .cuis,.card:focus-visible .cuis{color:var(--accent-paper); opacity:.7;}
.card .items{font-size:14px; color:var(--ink-dim); margin-top:var(--s2);}
.card:hover .items,.card:focus-visible .items{color:var(--accent-paper); opacity:.85;}
.card .meta{font-size:14px; margin-top:var(--s2);}
.card .why{font-size:12px; color:var(--ink-dim); margin-top:var(--s3); padding-top:var(--s3); border-top:1px solid var(--rule);}
.card:hover .why,.card:focus-visible .why{color:var(--accent-paper); opacity:.75; border-color:rgba(255,255,255,.2);}
.why-these{font-size:14px; color:var(--ink-dim); font-style:italic; margin-top:var(--s4);}
@keyframes fade{from{opacity:0} to{opacity:1}}

/* confirmation */
.confirm h2{font-size:24px; font-weight:500; margin:0 0 var(--s2);}
.confirm p{color:var(--ink-dim); margin:0;}
.again{display:inline-block; margin-top:var(--s6); font-size:14px; color:var(--ink-dim);
  background:none; border:none; padding:0; text-decoration:underline; text-underline-offset:3px;}
.again:hover{color:var(--ink)}

/* playback controls */
.controls{display:flex; gap:var(--s2); justify-content:flex-end; margin-top:var(--s5);}
.controls button{font-size:13px; background:var(--surface); border:1px solid var(--rule);
  border-radius:var(--r-sm); color:var(--ink-dim); padding:8px 14px; min-height:36px;}
.controls button:hover{color:var(--ink)}
.controls button[aria-pressed="true"]{background:var(--accent-ink); color:var(--accent-paper); border-color:var(--accent-ink);}

/* focus ring */
:focus-visible{outline:2px solid var(--focus); outline-offset:2px;}

/* consent ask */
.ask{margin-top:var(--s4);max-width:560px}
.ask-prompt{font-size:18px;line-height:1.5;color:var(--ink);margin:0 0 var(--s3)}
.ask-actions{display:flex;gap:var(--s2)}
.ask-actions button{
  font-family:var(--sans);font-size:14px;padding:var(--s2) var(--s3);
  border-radius:8px;cursor:pointer;border:1px solid var(--rule);background:var(--bg)
}
.ask-actions button.ask-yes{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ask-actions button.ask-yes:focus-visible,.ask-actions button.ask-no:focus-visible{outline:2px solid #0066FF;outline-offset:2px}
.ask-actions button.ask-no{color:var(--ink-faint)}

/* responsive */
@media (max-width:760px){
  .wrap{padding:var(--s5) var(--s3)}
  .cards{grid-template-columns:1fr}
  .current{font-size:20px}
}
@media (prefers-reduced-motion:reduce){
  .card{animation:none}
}
</style>
</head>
<body>
<div class="wrap">

  <!-- LANDING -->
  <section id="landing">
    <div class="wordmark">uber-arrival-agent</div>
    <p class="tagline">An agent that watches your trip and times dinner to your arrival.
      It waits, re-times as your flight and ride happen, recovers when a restaurant drops,
      then hands you a few options. You take the final call.</p>
    <div class="scenarios" id="scn-list"></div>
    <a class="source" href="https://github.com/ankitasinha015/uber-arrival-agent" target="_blank" rel="noopener">source on github →</a>
  </section>

  <!-- STREAMING / CHOICE / CONFIRMATION -->
  <section id="run" class="hidden">
    <header class="bar">
      <button class="back" id="back">← back</button>
      <span class="wordmark">uber-arrival-agent</span>
    </header>

    <div class="current" id="current" aria-live="polite"></div>
    <div class="reasoning" id="reasoning" aria-live="polite"></div>

    <div id="ask" class="ask hidden">
      <p class="ask-prompt" id="ask-prompt"></p>
      <div class="ask-actions">
        <button class="ask-yes" id="ask-yes">Yes, sort it out</button>
        <button class="ask-no" id="ask-no">No thanks</button>
      </div>
    </div>

    <div id="choice" class="hidden">
      <div class="choice-intro" id="choice-intro"></div>
      <div class="cards" id="cards"></div>
      <div class="why-these" id="why-these"></div>
    </div>

    <div id="confirm" class="confirm hidden">
      <h2 id="confirm-head"></h2>
      <p id="confirm-detail"></p>
      <button class="again" id="again">watch again →</button>
    </div>

    <hr class="divider">
    <details id="timeline-wrap">
      <summary style="cursor:pointer;font-size:12px;color:var(--ink-faint);font-family:var(--mono)">trip events</summary>
      <div class="timeline" id="timeline" style="margin-top:var(--s2)"></div>
    </details>

    <div class="controls" id="controls">
      <button data-speed="1" aria-pressed="true">1×</button>
      <button data-speed="4" aria-pressed="false">4×</button>
      <button id="skip">skip ahead</button>
    </div>
  </section>

</div>
<script>
const $ = s => document.querySelector(s);
const reduced = matchMedia('(prefers-reduced-motion:reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));

let runId = null, es = null, speed = 1, skipping = false;
let queue = [], pumping = false, pickSubmitted = false, consentSubmitted = false;

// --- landing ---------------------------------------------------------------
async function loadScenarios(){
  const list = $('#scn-list'); list.innerHTML = '';
  const scns = await (await fetch('/api/scenarios')).json();
  for (const s of scns){
    const b = document.createElement('button');
    b.className = 'scn';
    b.innerHTML = `<h3>${s.name}</h3><p>${s.description}</p>`;
    b.onclick = () => startRun(s.name);
    list.appendChild(b);
  }
}

// --- run lifecycle ---------------------------------------------------------
async function startRun(name){
  resetView();
  $('#landing').classList.add('hidden');
  $('#run').classList.remove('hidden');
  const r = await (await fetch('/api/run', {method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({scenario:name})})).json();
  runId = r.run_id;
  es = new EventSource(`/api/run/${runId}/stream`);
  es.addEventListener('decision', e => enqueue('decision', JSON.parse(e.data)));
  es.addEventListener('awaiting_consent', e => enqueue('awaiting_consent', JSON.parse(e.data)));
  es.addEventListener('awaiting_pick', e => enqueue('awaiting_pick', JSON.parse(e.data)));
  es.addEventListener('done', e => enqueue('done', JSON.parse(e.data)));
  es.addEventListener('error', e => { try{ enqueue('error', JSON.parse(e.data)); }catch(_){} });
}

function resetView(){
  queue = []; pumping = false; pickSubmitted = false; consentSubmitted = false; skipping = false; speed = 1;
  setSpeedButtons();
  $('#current').textContent = '';
  $('#reasoning').innerHTML = '';
  $('#timeline').innerHTML = '';
  $('#ask').classList.add('hidden');
  $('#choice').classList.add('hidden');
  $('#cards').innerHTML = '';
  $('#why-these').textContent = '';
  $('#confirm').classList.add('hidden');
  $('#controls').classList.remove('hidden');
  if (es){ es.close(); es = null; }
}

// --- message reveal loop ("watch it think") --------------------------------
function enqueue(kind, data){ queue.push({kind, data}); pump(); }

async function pump(){
  if (pumping) return; pumping = true;
  while (queue.length){
    const {kind, data} = queue.shift();
    await reveal(kind, data);
    if (!skipping) await sleep(450 / speed);
  }
  pumping = false;
}

const VERBS = {wait:'Waiting', ask:'A quick check', surface:'Here are your options', placed:'Order placed'};

async function reveal(kind, data){
  if (kind === 'decision'){
    const d = data.decision;
    addTimeline(data.event_type, data.event_at, d.action);
    if (d.action === 'placed'){ showConfirm(d); return; }
    $('#current').textContent = VERBS[d.action] || d.action;
    await addReasoning(data.event_type, d.reasoning);
    if (d.action === 'surface' && d.choice_set){ renderCards(d); }
  } else if (kind === 'awaiting_consent'){
    showAsk(data.prompt);
  } else if (kind === 'awaiting_pick'){
    $('#current').textContent = 'Pick one — we’ll have it timed to your door';
  } else if (kind === 'done'){
    $('#controls').classList.add('hidden');
  } else if (kind === 'error'){
    $('#current').textContent = 'Something went wrong';
    await addReasoning('error', data.message);
  }
}

function setLatest(){
  document.querySelectorAll('.rline').forEach(el => el.classList.remove('latest'));
}

async function addReasoning(eventType, text){
  setLatest();
  const line = document.createElement('div');
  line.className = 'rline latest';
  const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = `${eventType}  `;
  const body = document.createElement('span');
  line.appendChild(tag); line.appendChild(body);
  $('#reasoning').appendChild(line);
  if (reduced || skipping){ body.textContent = text; return; }
  for (const ch of text){
    body.textContent += ch;
    await sleep(7 / speed);
    if (skipping){ body.textContent = text; break; }
  }
}

function addTimeline(type, at, action){
  const t = new Date(at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  const row = document.createElement('div');
  row.textContent = `${t}  ${type}  →  ${action}`;
  document.querySelectorAll('#timeline div').forEach(el => el.classList.remove('now'));
  row.className = 'now';
  $('#timeline').appendChild(row);
}

// --- choice cards ----------------------------------------------------------
function renderCards(d){
  $('#choice').classList.remove('hidden');
  $('#choice-intro').textContent = d.axis ? `Choosing on: ${d.axis.replace(/_/g,' ')}` : '';
  $('#why-these').textContent = d.why_these || '';
  const wrap = $('#cards'); wrap.innerHTML = '';
  for (const o of d.choice_set){
    const total = o.est_total ? `$${Math.round(o.est_total)}` : '';
    const eta = o.est_delivery_at ? new Date(o.est_delivery_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
    const card = document.createElement('button');
    card.className = 'card';
    card.innerHTML =
      `<div class="name">${o.restaurant_name}</div>` +
      `<div class="cuis">${(o.cuisine_tags||[]).slice(0,2).join(' · ')}</div>` +
      `<div class="items">${(o.items||[]).join(', ')}</div>` +
      `<div class="meta">${total}${total&&eta?' · ':''}${eta?'eta '+eta:''}</div>` +
      (o.why_this_one ? `<div class="why">${o.why_this_one}</div>` : '');
    card.onclick = () => pick(o.option_id);
    wrap.appendChild(card);
  }
}

async function pick(optionId){
  if (pickSubmitted) return;
  pickSubmitted = true;
  await fetch(`/api/run/${runId}/pick`, {method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({option_id: optionId})});
  $('#choice').classList.add('hidden');
}

// --- consent ask -----------------------------------------------------------
function showAsk(prompt){
  $('#ask-prompt').textContent = prompt || 'Want me to handle dinner for when you arrive?';
  $('#ask').classList.remove('hidden');
  $('#ask-yes').onclick = () => consent(true);
  $('#ask-no').onclick = () => consent(false);
}

async function consent(yes){
  if (consentSubmitted) return;
  consentSubmitted = true;
  $('#ask').classList.add('hidden');
  if (!yes) $('#current').textContent = 'No problem — I’ll stay out of it.';
  await fetch(`/api/run/${runId}/consent`, {method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({consent: !!yes})});
}

function showConfirm(d){
  $('#choice').classList.add('hidden');
  $('#current').textContent = '';
  $('#confirm').classList.remove('hidden');
  $('#confirm-head').textContent = 'Order placed.';
  $('#confirm-detail').textContent = d.reasoning;
}

// --- playback controls -----------------------------------------------------
function setSpeedButtons(){
  document.querySelectorAll('#controls [data-speed]').forEach(b =>
    b.setAttribute('aria-pressed', String(Number(b.dataset.speed) === speed)));
}
document.querySelectorAll('#controls [data-speed]').forEach(b =>
  b.onclick = () => { speed = Number(b.dataset.speed); setSpeedButtons(); });
$('#skip').onclick = () => { skipping = true; };
$('#back').onclick = () => { resetView(); $('#run').classList.add('hidden'); $('#landing').classList.remove('hidden'); };
$('#again').onclick = $('#back').onclick;

loadScenarios();
</script>
</body>
</html>
