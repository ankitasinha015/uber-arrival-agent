<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>trip concierge</title>
<style>
:root{
  --bg:#fbfbfb; --surface:#fff; --ink:#1a1a1a; --ink-soft:#6a6a6a; --ink-faint:#9a9a9a;
  --rule:#ededed; --rule-soft:#e6e6e6; --accent:#0066ff;
  --sans:'Inter',system-ui,-apple-system,sans-serif; --mono:ui-monospace,'JetBrains Mono',monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:var(--sans);color:var(--ink);
  display:flex;justify-content:center;padding:24px 12px}
.phone{width:410px;max-width:100%;border:1px solid var(--rule);border-radius:28px;
  overflow:hidden;background:var(--surface);display:flex;flex-direction:column;
  min-height:500px;max-height:88vh}
.ctx{padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--bg);font-size:11.5px;color:var(--ink-soft)}
.ctx-row{display:flex;justify-content:space-between;gap:10px;margin-bottom:3px}
.ctx-live{font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
.ctx-src{font-size:9.5px;color:var(--ink-faint);margin-top:3px}
.bar{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--rule)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.who{line-height:1.15}
.who b{font-size:13px} .who span{font-size:10.5px;color:var(--ink-soft);display:block}
.clock{margin-left:auto;font-size:10px;color:var(--ink-faint);font-family:var(--mono)}
.thread{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1;overflow-y:auto}
.bubble{max-width:88%;background:var(--surface);border:1px solid var(--rule);
  border-radius:14px 14px 14px 4px;padding:11px 13px;font-size:13.5px;line-height:1.45}
.you{align-self:flex-end;background:var(--accent);color:#fff;font-size:12.5px;
  padding:8px 13px;border-radius:14px 14px 4px 14px}
.card{max-width:94%;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:12px 13px}
.card .lead{font-size:13.5px;line-height:1.45;margin-bottom:8px}
.draft{border-left:2px solid var(--rule-soft);padding:7px 11px;font-size:12px;color:var(--ink-soft);
  font-style:italic;line-height:1.4;margin:6px 0 10px}
.draft-edit{width:100%;min-height:76px;font-family:inherit;font-size:12px;color:var(--ink);
  border:1px solid var(--accent);border-radius:8px;padding:8px 10px;resize:vertical;line-height:1.45;
  margin:6px 0 10px;outline:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{padding:9px 15px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;
  border:1px solid var(--rule-soft);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.ghost{color:var(--ink-soft);font-weight:400}
.opt{border:1px solid var(--rule-soft);border-radius:12px;padding:11px;margin-top:9px;cursor:pointer;
  display:block;width:100%;text-align:left;background:var(--surface)}
.opt:hover{border-color:var(--ink)}
.opt .top{display:flex;justify-content:space-between;align-items:baseline}
.opt .name{font-size:14px;font-weight:600}
.opt .meta{font-size:11.5px;color:var(--ink-soft);font-family:var(--mono)}
.opt .why{font-size:12px;color:var(--ink-soft);margin-top:2px}
.opt.usual{border-color:var(--accent)}
.cz{font-size:10px;color:var(--ink-faint);border:1px solid var(--rule-soft);border-radius:5px;padding:1px 5px;font-weight:400;vertical-align:middle}
.star{font-size:10px;color:var(--accent);font-weight:600;margin-left:2px}
.axis{font-size:11px;color:var(--ink-faint);text-transform:none;margin:2px 0 2px}
.offline{margin-top:9px;font-size:11px;color:var(--accent);cursor:pointer;background:none;border:none;padding:0}
.note{font-size:11px;color:var(--ink-faint);margin-left:auto}
.done h3{margin:0 0 3px;font-size:15px} .done p{margin:0;font-size:12.5px;color:var(--ink-soft)}
.hint{text-align:center;font-size:11px;color:var(--ink-faint);padding:8px}
.foot{display:flex;align-items:center;gap:9px;padding:11px 14px;border-top:1px solid var(--rule)}
.foot .fake{flex:1;font-size:12.5px;color:var(--ink-faint);padding:9px 13px;
  border:1px solid var(--rule-soft);border-radius:20px}
.replay{font-size:11px;color:var(--accent);cursor:pointer;background:none;border:none}
.toggle{margin-left:auto;display:flex;border:1px solid var(--rule-soft);border-radius:8px;overflow:hidden}
.toggle button{font-size:10.5px;padding:5px 10px;border:none;background:var(--surface);color:var(--ink-soft);cursor:pointer}
.toggle button.on{background:var(--ink);color:#fff}
.dim{opacity:.5;pointer-events:none}
.card.acted{border-color:#bfe3c8;background:#f6fbf7}
.card.acted .lead{font-weight:600}
.note-line{font-size:10.5px;color:var(--ink-faint);margin-top:6px}
ul.synced{margin:7px 0 4px;padding-left:16px;font-size:12.5px;color:var(--ink-soft);line-height:1.5}
ul.synced li{margin:3px 0} ul.synced b{color:var(--ink);font-weight:600}
.flag{margin-top:8px;padding:8px 10px;background:#fff7ec;border:1px solid #f2dcae;border-radius:8px;
  font-size:12px;color:#8a6a2f;line-height:1.4} .flag b{color:#6b4f1c}
.conf{font-family:var(--mono);font-size:10px;color:#1f9d55;background:#eafbf0;border:1px solid #cceedd;
  border-radius:5px;padding:1px 5px;margin-left:2px;white-space:nowrap}
.ride-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:700}
.ride-badge{font-size:10px;font-weight:600;color:#1f9d55;background:#eafbf0;border:1px solid #cceedd;
  border-radius:6px;padding:2px 7px;white-space:nowrap;flex:none}
.ride-at{font-size:14.5px;font-weight:700;margin:7px 0 3px}
.ride-meta{font-size:11.5px;color:var(--ink-soft)} .ride-meta b{color:var(--ink);font-family:var(--mono);font-size:11px}
.card.confirm{border-color:#bfe3c8;background:#f6fbf7}
.card.ride{background:#111;border-color:#111;color:#fff}
.card.ride .ride-badge{color:#5ef0a6;background:rgba(94,240,166,.12);border-color:rgba(94,240,166,.3)}
.card.ride .ride-meta{color:#c9c9c9} .card.ride .ride-meta b{color:#fff}
.ride-badge.live{color:#5ef0a6}
.btn.track{display:inline-block;margin-top:11px;background:#fff;color:#111;border:1px solid #fff;
  padding:9px 14px;border-radius:9px;font-size:12.5px;font-weight:600;text-decoration:none}
.btn.track:hover{background:#eee}
.read{align-self:center;font-family:var(--mono);font-size:10px;color:var(--ink-faint);
  background:var(--bg);border:1px dashed var(--rule-soft);border-radius:6px;padding:3px 9px;letter-spacing:.2px}
/* login / traveler select */
.login{padding:18px 16px 20px;display:flex;flex-direction:column;gap:9px;flex:1;overflow-y:auto}
.login[hidden]{display:none}   /* class sets display:flex, so re-hide explicitly */
.login h2{margin:0;font-size:15.5px;letter-spacing:-.2px}
.login .sub{margin:0 0 6px;font-size:11.5px;color:var(--ink-soft);line-height:1.4}
.pcard{display:flex;align-items:center;gap:11px;border:1px solid var(--rule-soft);border-radius:12px;
  padding:11px 12px;cursor:pointer;background:var(--surface);text-align:left;width:100%;font-family:inherit;
  transition:border-color .12s,transform .06s}
.pcard:hover{border-color:var(--ink)}
.pcard:active{transform:scale(.99)}
.pcard .pav{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.pcard .pbody{min-width:0}
.pcard .pnm{font-size:13.5px;font-weight:650;color:var(--ink)}
.pcard .ptg{font-size:11px;color:var(--ink-soft);margin-top:1px}
.pcard .parr{margin-left:auto;color:var(--ink-faint);font-size:16px;flex:none}
.switch{margin-left:auto;font-size:10.5px;color:var(--accent);background:none;border:none;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="phone">
  <div class="bar">
    <div class="avatar" id="avatar">A</div>
    <div class="who"><b id="whoName">Arrival agent</b><span id="whoSub">watching SFO arrival · tonight</span></div>
    <button class="switch" id="switch" hidden>↺ Switch traveler</button>
  </div>
  <div class="login" id="login" hidden></div>
  <div class="ctx" id="ctx" hidden></div>
  <div class="thread" id="thread"></div>
  <div class="foot" id="foot" style="display:flex;gap:8px;align-items:center">
    <input id="say" autocomplete="off" placeholder="Ask the agent anything…"
      style="flex:1;border:1px solid var(--rule,#e2e2e2);border-radius:18px;padding:9px 13px;font-size:13px;font-family:inherit;outline:none">
    <button id="sayBtn" aria-label="send"
      style="width:34px;height:34px;border:none;border-radius:50%;background:#0066ff;color:#fff;font-size:15px;cursor:pointer;flex:none">↑</button>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
const thread = $('#thread');
let runId = null, es = null, awaitingId = null;

function scroll(){ thread.scrollTop = thread.scrollHeight; }
function el(cls, html){ const d = document.createElement('div'); d.className = cls; if(html!=null) d.innerHTML = html; thread.appendChild(d); scroll(); return d; }

// The composer only means something when the agent is paused at a decision — the
// /say endpoint interprets your words against THAT pause. Reflect that in the UI so
// typing between beats isn't a silent no-op: enabled + a contextual hint at a pause,
// disabled + an honest placeholder otherwise.
const SAY_HINTS = {
  ask_hotel:  'Reply in words — e.g. “yes, tell them” — or tap above',
  send:       'Type “send”, or your edits — or tap above',
  pick:       'Name a dish or spot — e.g. “the ramen” — or tap a card',
  book_ride:  '“book it” or “I’ll sort my own” — or tap above',
  confirm_dish:'“order it” or “back to options” — or tap above',
  snooze:     '“got it” — or tap above',
};
function setComposer(active, hint){
  const say = $('#say'), btn = $('#sayBtn');
  say.disabled = !active; btn.disabled = !active;
  say.placeholder = active ? (hint || 'Reply in words, or use the buttons above…')
                           : 'The agent will ask when it needs a decision…';
  say.style.opacity = active ? '1' : '.45';
  btn.style.background = active ? '#0066ff' : '#c9c9c9';
  btn.style.cursor = active ? 'pointer' : 'default';
  if (active) setTimeout(() => say.focus(), 0);
}

async function respond(actionId, body){
  if (awaitingId !== actionId) return;
  awaitingId = null;
  setComposer(false);   // decision made — nothing to type until the next pause
  await fetch(`/api/concierge/${runId}/respond`, {method:'POST',
    headers:{'content-type':'application/json'}, body: JSON.stringify(body)});
}

function esc(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

let CUR = '$';
function renderCtx(c){
  if (c.currency) CUR = c.currency;
  const box = $('#ctx'); box.hidden = false;
  const status = c.changed ? ('flight changed → '+esc(c.new_flight||'')) : (c.delay_min ? ('delayed '+c.delay_min+'m') : 'on time');
  const live = `security ${c.security_min}m · ${status}`;
  box.innerHTML =
    `<div class="ctx-row"><span>✈️ ${esc(c.flight)} · ${esc(c.route)}</span><span>🏨 ${esc(c.hotel)}</span></div>`+
    `<div class="ctx-row"><span>🕐 arrives ${esc(c.arrival)}</span><span class="ctx-live">live · ${esc(live)}</span></div>`+
    `<div class="ctx-src">${esc(c.source)}</div>`;
}

function renderTodo(d){
  awaitingId = d.action_id;
  setComposer(true, SAY_HINTS[d.kind]);   // a decision is on the table — you can reply in words
  const p = d.payload || {};
  if (p.note) el('bubble', esc(p.note));   // the agent's reply to a refinement / recovery
  if (d.kind === 'ask_hotel'){
    const c = el('card');
    c.innerHTML = `<div class="lead">${esc(p.question)}</div>
      <div class="row"><button class="btn primary" data-a="yes">Yes, tell the hotel</button>
      <button class="btn ghost" data-a="no">No, I'll handle it</button></div>`;
    c.querySelector('[data-a="yes"]').onclick = () => { markDone(c); respond(d.action_id, {decision:'yes'}); };
    c.querySelector('[data-a="no"]').onclick = () => { markDone(c); respond(d.action_id, {decision:'no'}); };
  } else if (d.kind === 'send'){
    const c = el('card');
    c.innerHTML = `<div class="lead">I drafted a note to the front desk so they hold your room:</div>
      <div class="draft" data-draft>"${esc(p.draft)}"</div>
      <div class="row"><button class="btn primary" data-a="send">Send</button>
      <button class="btn" data-a="edit">Edit</button>
      <button class="btn ghost" data-a="decline">No thanks</button>
      <span class="note">you approve · nothing sent yet</span></div>`;
    const draftEl = c.querySelector('[data-draft]');
    let ta = null;
    c.querySelector('[data-a="edit"]').onclick = () => {
      if (ta){ ta.focus(); return; }
      ta = document.createElement('textarea'); ta.className = 'draft-edit'; ta.value = p.draft;
      draftEl.replaceWith(ta); ta.focus();
    };
    c.querySelector('[data-a="send"]').onclick = () => {
      const note = ta ? ta.value.trim() : null;
      markDone(c); respond(d.action_id, note ? {decision:'send', note} : {decision:'send'});
    };
    c.querySelector('[data-a="decline"]').onclick = () => { markDone(c); respond(d.action_id, {decision:'decline'}); };
  } else if (d.kind === 'pick'){
    const c = el('card');
    let h = `<div class="lead">${esc(p.lead || "Here are your options, timed to land ~20 min after you're in.")}</div>`;
    if (p.why_these) h += `<div class="axis">${esc(p.why_these)}</div>`;
    c.innerHTML = h;
    (p.options||[]).forEach((o,i) => {
      const eta = o.est_delivery_at ? new Date(o.est_delivery_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
      const cz = (o.cuisine_tags||[])[0];
      const b = document.createElement('button'); b.className = 'opt' + (o.badge ? ' usual' : '');
      b.innerHTML = `<div class="top"><span class="name">${esc(o.restaurant_name)}`
        + (cz ? ` <span class="cz">${esc(cz)}</span>` : '')
        + (o.badge ? ` <span class="star">★ ${esc(o.badge)}</span>` : '') + `</span>
        <span class="meta">~${CUR}${Math.round(o.est_total)}${eta?' · eta '+eta:''}</span></div>
        <div class="why">${esc(o.why_this_one)}</div>`;
      b.onclick = () => { markDone(c); respond(d.action_id, {decision:'pick', option_id:o.option_id}); };
      c.appendChild(b);
    });
    const off = document.createElement('button'); off.className = 'offline';
    off.textContent = 'a restaurant just went offline →';
    off.onclick = () => { respond(d.action_id, {decision:'order_rejected', restaurant_id:(p.options[0]||{}).restaurant_id}); };
    c.appendChild(off);
  } else if (d.kind === 'book_ride'){
    const c = el('card');
    c.innerHTML = `<div class="lead">🚗 Ready when you are — want me to book an Uber to ${esc(p.hotel)}?</div>
      <div class="axis">It'll be waiting at arrivals by the time you're out (~35 min).</div>
      <div class="row"><button class="btn primary" data-a="book">Book my ride</button>
      <button class="btn ghost" data-a="decline">I'll sort my own</button></div>`;
    c.querySelector('[data-a="book"]').onclick = () => { markDone(c); respond(d.action_id, {decision:'book'}); };
    c.querySelector('[data-a="decline"]').onclick = () => { markDone(c); respond(d.action_id, {decision:'decline'}); };
  } else if (d.kind === 'confirm_dish'){
    const c = el('card');
    const pitch = p.pitch || `A popular pick at ${esc(p.restaurant_name)} is the ${esc(p.dish)}.`;
    c.innerHTML = `<div class="lead">${esc(pitch)}</div>
      <div class="axis">Order the <b>${esc(p.dish)}</b> on Uber Eats from ${esc(p.restaurant_name)} to your room at ${esc(p.hotel)}?</div>
      <div class="row"><button class="btn primary" data-a="confirm">Order it to my room</button>
      <button class="btn ghost" data-a="back">Back to options</button></div>`;
    c.querySelector('[data-a="confirm"]').onclick = () => { markDone(c); respond(d.action_id, {decision:'confirm'}); };
    c.querySelector('[data-a="back"]').onclick = () => { markDone(c); respond(d.action_id, {decision:'back'}); };
  } else { // snooze / heads-up
    const c = el('card');
    c.innerHTML = `<div class="lead">${esc(p.detail||d.title)}</div>
      <div class="row"><button class="btn primary" data-a="snooze">Got it</button></div>`;
    c.querySelector('[data-a="snooze"]').onclick = () => { markDone(c); respond(d.action_id, {decision:'snooze'}); };
  }
  scroll();
}
function markDone(card){ card.classList.add('dim'); }
function renderActed(d){
  const c = el('card acted');
  c.innerHTML = `<div class="lead">${esc(d.text)}</div>`
    + (d.note ? `<div class="draft">"${esc(d.note)}"</div>` : '')
    + `<div class="note-line">the agent handled this — no approval needed</div>`;
}
function renderConfirm(d){
  const uber = d.accent === 'uber';
  const c = el('card ' + (uber ? 'ride' : 'confirm'));
  const icon = d.icon || '📌';
  c.innerHTML = `<div class="ride-h"><span>${esc(icon)} ${esc(d.name)}</span><span class="ride-badge">✓ Booking confirmed</span></div>`
    + (d.at ? `<div class="ride-at">${esc(d.at)}</div>` : '')
    + `<div class="ride-meta">${esc(d.did)}${d.confirm ? ' · confirmation <b>'+esc(d.confirm)+'</b>' : ''}</div>`;
}
function renderTrack(d){
  const c = el('card ride');
  c.innerHTML = `<div class="ride-h"><span>🚗 Your Uber is on the way</span><span class="ride-badge live">● live</span></div>`
    + `<div class="ride-meta" style="margin-top:6px">You've landed — the driver's heading to arrivals.`
    + `${d.at ? ' '+esc(d.at)+'.' : ''}${d.confirm ? ' · conf <b>'+esc(d.confirm)+'</b>' : ''}</div>`
    + `<a class="btn track" href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">Track your ride in the Uber app →</a>`;
}
function renderSynced(d){
  const c = el('card acted');
  const items = d.items || [];
  let h = '';
  if (items.length){
    h += `<div class="lead">✅ Also synced to the new arrival:</div>`;
    h += '<ul class="synced">' + items.map(it =>
        `<li><b>${esc(it.name)}</b> — ${esc(it.did)}`
        + (it.confirm ? ` <span class="conf">✓ ${esc(it.confirm)}</span>` : '')
        + `</li>`).join('') + '</ul>';
  }
  if (d.flag){
    if (!items.length) h += `<div class="lead">One thing that's yours to decide:</div>`;
    h += `<div class="flag">⚠️ <b>${esc(d.flag.name)}</b> — ${esc(d.flag.note)}</div>`;
  }
  h += `<div class="note-line">handled automatically${d.flag ? ' · the flagged item is yours to decide' : ''}</div>`;
  c.innerHTML = h;
}

const VERB = {yes:'Yes, tell the hotel', no:"No, I'll handle it", send:'Sent the note', pick:'Picked', confirm:'Order it', back:'Back to options', snooze:'Got it', decline:'No thanks', book:'Book my ride'};

// ---- traveler login: pick one of the five, run their scenario ----
let mode = null, PMETA = {};
function setBar(id){
  const p = PMETA[id];
  $('#avatar').textContent = p ? p.initial : 'A';
  $('#whoName').textContent = p ? p.name : 'Arrival agent';
  $('#whoSub').textContent = p ? `${p.tag} · watching ${p.city||'your'} arrival tonight` : 'watching your arrival · tonight';
}
function showLogin(){
  if (es) es.close();
  $('#switch').hidden = true;
  $('#login').hidden = false;
  $('#foot').style.display = 'none';
  $('#ctx').hidden = true;
  thread.innerHTML = '';
  $('#avatar').textContent = 'A'; $('#whoName').textContent = 'Arrival agent'; $('#whoSub').textContent = 'choose a traveler';
}
function buildLogin(list){
  const box = $('#login');
  box.innerHTML = `<h2>Choose a traveler</h2>
    <p class="sub">Each runs their own scenario — their Uber Eats taste, trip delay, and what the agent has learned about them.</p>`;
  list.forEach(p => {
    const b = document.createElement('button'); b.className = 'pcard';
    b.innerHTML = `<span class="pav">${esc(p.initial)}</span>
      <span class="pbody"><div class="pnm">${esc(p.name)}</div><div class="ptg">${esc(p.tag)}</div></span>
      <span class="parr">→</span>`;
    b.onclick = () => enter(p.id);
    box.appendChild(b);
  });
}
function enter(id){
  mode = id;
  PMETA[id] || (PMETA[id] = null);
  setBar(id);
  $('#login').hidden = true;
  $('#foot').style.display = 'flex';
  $('#switch').hidden = false;
  start();
}
$('#switch').onclick = showLogin;

let rebootT = null;
function start(){
  thread.innerHTML = '';
  setComposer(false);   // starts idle; enabled when the agent reaches a decision
  clearTimeout(rebootT);
  fetch(`/api/concierge/run?mode=${mode}`, {method:'POST'}).then(r=>r.json()).then(r=>{
    runId = r.run_id;
    if (es) es.close();
    let ended = false;
    es = new EventSource(`/api/concierge/${runId}/stream`);
    es.onerror = () => {
      // stream dropped (e.g. the server restarted). Don't let EventSource
      // silently reconnect to a stale run — start this traveler fresh so the
      // data is always current.
      if (ended || !es) return;
      es.close(); es = null;
      if (mode) rebootT = setTimeout(start, 1200);
    };
    es.addEventListener('context', e => renderCtx(JSON.parse(e.data)));
    es.addEventListener('read', e => { const d = JSON.parse(e.data); el('read', esc(d.text.split('→')[0].trim())); });
    es.addEventListener('agent', e => el('bubble', esc(JSON.parse(e.data).text)));
    es.addEventListener('acted', e => renderActed(JSON.parse(e.data)));
    es.addEventListener('confirm', e => renderConfirm(JSON.parse(e.data)));
    es.addEventListener('track', e => renderTrack(JSON.parse(e.data)));
    es.addEventListener('synced', e => renderSynced(JSON.parse(e.data)));
    es.addEventListener('todo', e => renderTodo(JSON.parse(e.data)));
    es.addEventListener('you', e => { const d = JSON.parse(e.data); el('you', esc(d.text || VERB[d.decision] || d.decision)); });
    es.addEventListener('done', e => {
      const o = (JSON.parse(e.data).outcomes || []).map(x=>x.outcome);
      const placed = o.find(v=>v&&v.placed);
      const sent = o.some(v=>v&&v.sent);
      const parts = [];
      if (placed) parts.push((placed.dish ? esc(placed.dish)+' from '+esc(placed.placed) : 'Dinner at '+esc(placed.placed))+', to your room');
      if (sent) parts.push('hotel notified');
      el('card done').innerHTML = `<div class="done"><h3>All set.</h3>
        <p>${parts.length ? parts.join(' · ')+'.' : 'Handled what you asked for.'}</p></div>`;
      ended = true; setComposer(false); es.close();
    });
    es.addEventListener('error', e => { try{ el('bubble', 'Something went wrong: '+esc(JSON.parse(e.data).message)); }catch(_){} });
  });
}
async function say(){
  const inp = $('#say'); const text = (inp.value || '').trim();
  if (!text || !runId) return;
  if (!awaitingId){   // no decision open — say so instead of a silent no-op
    el('bubble', "I'm on it — I'll ask here the moment there's something for you to decide.");
    return;
  }
  inp.value = '';
  const r = await fetch(`/api/concierge/${runId}/say`, {method:'POST',
    headers:{'content-type':'application/json'}, body: JSON.stringify({text})});
  if (r.ok){ awaitingId = null; setComposer(false); }
  else { inp.value = text;   // keep their text; the pause just isn't ready yet
    el('bubble', "I can only take a reply when there's a decision on the table — try the buttons above."); }
}
$('#sayBtn').onclick = say;
$('#say').addEventListener('keydown', e => { if (e.key === 'Enter') say(); });

// boot: load the roster, then show login (or deep-link straight into ?mode=)
const urlMode = new URLSearchParams(location.search).get('mode');
fetch('/api/concierge/personas').then(r=>r.json()).then(list => {
  list.forEach(p => PMETA[p.id] = p);
  buildLogin(list);
  if (urlMode) { enter(urlMode); } else { showLogin(); }
}).catch(() => { mode = urlMode || 'new'; $('#foot').style.display='flex'; start(); });
</script>
