[project]
name = "arrival-agent"
version = "0.1.0"
description = "Agentic system at the Uber Travel Mode x Eats seam — predicts hotel arrival, curates open food, re-times delivery as the trip unfolds."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",   # durable trip state for the live demo
    "langchain-core>=0.3",
    "langchain-anthropic>=0.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    # Anthropic SDK for the choice-set LLM call (used by core/domain/choice_set.py).
    "anthropic>=0.39",
    # Web layer: FastAPI app + SSE streaming of agent decisions (src/.../web/).
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
# Taste store: per-user vector similarity for past-pick taste matching, via a
# direct cosine store on sentence-transformers + numpy (~80 lines; chromadb's
# 1.x Rust backend was unstable on Windows — see DESIGN.md > "Taste store").
# It is an EXTRA, not a core dep: the taste store runs only during cache
# RECORD (its effect bakes into the cached choice set) and is skipped in
# REPLAY, so the deployed image needs neither it nor torch. Install locally
# with `pip install -e .[taste]` to record / run tests.
taste = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
arrival-agent = "arrival_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
